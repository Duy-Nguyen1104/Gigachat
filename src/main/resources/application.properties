spring.application.name=gigachat

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/gigachat
spring.datasource.username=postgres
spring.datasource.password=nguyenduy2004
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=thGkdqvLv1Gvg5GeAguZTMSntpYvZt2owCLwqmpcsjg
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.project.gigachat=DEBUG

# AWS S3 Configuration
aws.s3.bucket-name=gigachat-dev
aws.s3.region=ap-southeast-2
aws.s3.presigned-url-expiration-minutes=15

# File Upload Configuration
upload.max-file-size=5242880
upload.allowed-image-types=image/jpeg,image/png,image/gif,image/webp
upload.allowed-file-types=image/jpeg,image/png,image/gif,image/webp,application/pdf,audio/mpeg,audio/ogg,audio/webm
